# Chart Quest — Netlify deployment configuration
# Security headers applied to every response.

# ── Build pipeline ──────────────────────────────────────────────────────────
# No build step — serve index.html directly from repo root.
# (Obfuscation build disabled; re-enable once build.js targets chart-quest.html)
[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    # Prevent clickjacking
    X-Frame-Options = "SAMEORIGIN"
    # Prevent MIME-type sniffing
    X-Content-Type-Options = "nosniff"
    # Referrer policy — don't leak URL to third parties
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Permissions policy — disable features the game doesn't use
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    # HSTS — force HTTPS for 1 year (including subdomains)
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # Content Security Policy
    # - default-src 'self'          → block all unlisted origins by default
    # - script-src  jsdelivr CDN    → only the Supabase SDK allowed from CDN
    # - connect-src supabase + coinbase + binance → only these external APIs.
    #   Coinbase is the PRIMARY live-price source (CORS-open, keyless, US-reachable);
    #   Binance is the fallback and is geo-blocked in the US. Omitting Coinbase silently
    #   kills live pricing on the deployed site while the HUD still claims it is live.
    # - img-src data:               → canvas toDataURL() needs data: URIs
    # - frame-ancestors 'none'      → belt-and-suspenders clickjack protection
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.coinbase.com https://api.binance.com https://cloudflareinsights.com https://*.cloudflareinsights.com; img-src 'self' data:; media-src 'self'; worker-src 'self'; frame-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'"

# Redirect HTTP → HTTPS (Netlify handles this by default, but explicit is safer)
[[redirects]]
  from = "http://chart-quest-game.netlify.app/*"
  to   = "https://chart-quest-game.netlify.app/:splat"
  status = 301
  force  = true

# Preview files — serve a 404 in production so dev artifacts are never public
[[redirects]]
  from   = "/preview-*.html"
  to     = "/404.html"
  status = 404
  force  = true
